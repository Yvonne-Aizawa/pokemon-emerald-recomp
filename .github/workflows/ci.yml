# Build and test the Linux and Windows versions.
#
# Build and test ONLY. The built game contains Nintendo's assets, so this
# workflow must never make it downloadable (PLAN.md, Phase 17):
#   - no actions/upload-artifact, no releases, no deploy steps;
#   - no caches of build output: a pull request from a fork can restore this
#     repository's caches, so compiled game code must never go into one.
# The one cache is what upstream's public sources generate in reference/
# (its host tools, converted graphics and sound; tools/ci_reference_cache.sh,
# which refuses to pack anything that looks like a build). The game itself is
# compiled from scratch on every run.

name: CI

# Changes that only touch documentation don't need a build.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packages both jobs need: upstream's host tools (preproc, gbagfx, ...)
  # and the ARM toolchain for the data-abi-matches-gba test.
  COMMON_PACKAGES: >-
    cmake gcc g++ make python3 patch libpng-dev
    gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

jobs:
  linux:
    name: Linux (32-bit)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      # Same key for both jobs: the generated files don't depend on the target.
      - name: Upstream asset cache key
        id: reference-cache
        run: echo "key=reference-prepare-v1-$(git rev-parse HEAD:reference)-${{ hashFiles('tools/prepare_reference.py', 'tools/ci_reference_cache.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore upstream assets
        id: reference-restore
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache/reference-prepare.tgz
          key: ${{ steps.reference-cache.outputs.key }}

      - name: Unpack upstream assets
        if: steps.reference-restore.outputs.cache-hit == 'true'
        run: tools/ci_reference_cache.sh restore .ci-cache/reference-prepare.tgz

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $COMMON_PACKAGES gcc-multilib libsdl2-dev:i386

      - name: Configure
        run: cmake -S . -B build -DPKM_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Pack upstream assets
        if: steps.reference-restore.outputs.cache-hit != 'true'
        run: tools/ci_reference_cache.sh save .ci-cache/reference-prepare.tgz

      - name: Save upstream assets
        if: steps.reference-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-cache/reference-prepare.tgz
          key: ${{ steps.reference-cache.outputs.key }}

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (32-bit, MinGW, tests under Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      # Same key for both jobs: the generated files don't depend on the target.
      - name: Upstream asset cache key
        id: reference-cache
        run: echo "key=reference-prepare-v1-$(git rev-parse HEAD:reference)-${{ hashFiles('tools/prepare_reference.py', 'tools/ci_reference_cache.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore upstream assets
        id: reference-restore
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache/reference-prepare.tgz
          key: ${{ steps.reference-cache.outputs.key }}

      - name: Unpack upstream assets
        if: steps.reference-restore.outputs.cache-hit == 'true'
        run: tools/ci_reference_cache.sh restore .ci-cache/reference-prepare.tgz

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $COMMON_PACKAGES gcc-mingw-w64-i686 wine wine32:i386 wine64

      - name: Fetch SDL2 for MinGW
        run: tools/fetch_sdl2_mingw.sh

      - name: Configure
        run: cmake -S . -B build-win --toolchain cmake/mingw-i686.cmake -DPKM_WERROR=ON

      - name: Build
        run: cmake --build build-win -j"$(nproc)"

      - name: Pack upstream assets
        if: steps.reference-restore.outputs.cache-hit != 'true'
        run: tools/ci_reference_cache.sh save .ci-cache/reference-prepare.tgz

      - name: Save upstream assets
        if: steps.reference-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci-cache/reference-prepare.tgz
          key: ${{ steps.reference-cache.outputs.key }}

      - name: Set up Wine
        run: wineboot --init && wineserver --wait

      - name: Test
        run: ctest --test-dir build-win --output-on-failure
