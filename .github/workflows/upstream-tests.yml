# Upstream's test suite (reference/test/; PLAN.md, Phase 19b) on the Linux
# build, split over several machines: each builds pkmemerald-tests and runs
# its part (--shard), on all its cores (-j). Separate from ci.yml so it can
# skip changes that can't affect the game (the path filter below).
#
# Build and test ONLY, as ci.yml (see its header): no artifacts, no caches of
# build output; every machine compiles its own copy.

name: Upstream tests

on:
  push:
    branches: [main]
    paths:
      - 'reference'
      - 'platform/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/upstream-tests.yml'
  pull_request:
    paths:
      - 'reference'
      - 'platform/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/upstream-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-tests:
    name: Upstream tests ${{ matrix.part }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # PARTS x JOBS shards in all (at most 32), the same JOBS everywhere:
        # each machine takes JOBS of them (pkmemerald-tests --shard).
        part: [1, 2, 3, 4]
    env:
      PARTS: 4
      JOBS: 4   # GitHub's Linux runners have 4 cores
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      # The same cache as ci.yml (which saves it): upstream's generated
      # host tools and converted assets.
      - name: Upstream asset cache key
        id: reference-cache
        run: echo "key=reference-prepare-v1-$(git rev-parse HEAD:reference)-${{ hashFiles('tools/prepare_reference.py', 'tools/ci_reference_cache.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore upstream assets
        id: reference-restore
        uses: actions/cache/restore@v6
        with:
          path: .ci-cache/reference-prepare.tgz
          key: ${{ steps.reference-cache.outputs.key }}

      - name: Unpack upstream assets
        if: steps.reference-restore.outputs.cache-hit == 'true'
        run: tools/ci_reference_cache.sh restore .ci-cache/reference-prepare.tgz

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcc g++ make python3 patch libpng-dev gcc-multilib libsdl2-dev:i386

      - name: Configure
        run: cmake -S . -B build -DPKM_WERROR=ON -DPKM_UPSTREAM_TESTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)" --target pkmemerald-tests

      # Results appear in the log as they come (CTest would hold them back).
      - name: Test (part ${{ matrix.part }} of 4)
        run: build/pkmemerald-tests -j "$JOBS" --shard "${{ matrix.part }}/$PARTS" test/

      # The runner's own checks (a failing test fails the run, crashes are
      # reported, ...): once, not per part.
      - name: Test the runner
        if: matrix.part == 1
        run: ctest --test-dir build --output-on-failure -R '^upstream-' -E '^upstream-battle-move-effect$'
